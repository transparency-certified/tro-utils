[build-system]
requires = ["setuptools >= 77.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tro-utils"
authors = [
  {name = "Kacper Kowalik", email = "xarthisius.kk@gmail.com"},
  {name = "Craig Willis", email = "willis8@illinois.edu"},
]
maintainers = [
  {name = "Kacper Kowalik", email = "xarthisius.kk@gmail.com"},
]
description = "Utilities for creating, editing and interacting with TROs"
readme = "README.md"
dynamic = ["version"]
dependencies = [
  "Click>=7.0",
  "jinja2",
  "packaging",
  "python-gnupg",
  "python-magic",
  "pyasn1",
  "pyyaml",
  "rfc3161ng",
  "graphviz",
  "rich",
]
requires-python = ">= 3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
tro-utils = "tro_utils.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=6.2.4",
    "pytest-cov>=7.0.0",
    "coverage>=7.0",
]
dev = [
    "pytest>=6.2.4",
    "pytest-cov>=7.0.0",
    "coverage>=7.0",
    "setuptools-scm",
    "black==26.3.1",
    "wheel>=0.33.6",
    "watchdog>=0.9.0",
    "flake8>=3.7.8",
    "Sphinx>=1.8.5",
    "twine>=1.14.0",
]

[tool.setuptools.package-data]
tro_utils = ["*.jinja2", "certs/*.pem"]

[tool.setuptools_scm]
write_to = "tro_utils/_version.py"

[tool.black]
target-version = ["py312", "py313", "py314"]
